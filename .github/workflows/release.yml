name: Release

# Push a tag like v0.2.1 to build the Windows installer and Linux AppImage
# and publish them as a GitHub Release. "Run workflow" from the Actions tab
# does a dry run: builds both and uploads them as workflow artifacts only.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    - name: Check version consistency
      shell: pwsh
      run: |
        $appVersion = python -c "from app.version import __version__; print(__version__)"
        $iss = Select-String -Path packaging\windows\valkyria.iss -Pattern '#define MyAppVersion "([^"]+)"'
        $issVersion = $iss.Matches[0].Groups[1].Value
        if ($appVersion -ne $issVersion) {
          throw "app/version.py ($appVersion) and valkyria.iss ($issVersion) disagree"
        }
        if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$appVersion") {
          throw "Tag $env:GITHUB_REF_NAME does not match app/version.py (v$appVersion)"
        }

    # build_installer.bat reuses .env if it exists, so create it here with
    # the dependencies pre-installed instead of letting it bootstrap.
    - name: Create build environment
      shell: pwsh
      run: |
        python -m venv .env
        .env\Scripts\python.exe -m pip install --upgrade pip
        .env\Scripts\python.exe -m pip install -r requirements.txt

    - name: Ensure Inno Setup is installed
      shell: pwsh
      run: |
        $found = (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe") -or (Test-Path "$env:ProgramFiles\Inno Setup 6\ISCC.exe")
        if (-not $found) { choco install innosetup -y --no-progress }

    - name: Build installer
      shell: cmd
      run: packaging\windows\build_installer.bat

    - uses: actions/upload-artifact@v7
      with:
        name: windows-installer
        path: dist/installer/ValkyriaSetup-*.exe
        if-no-files-found: error

  linux:
    # Oldest available LTS runner: a PyInstaller binary only runs on
    # systems with a glibc at least as new as the one it was built on.
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    - name: Check version consistency
      run: |
        APP_VERSION="$(python -c 'from app.version import __version__; print(__version__)')"
        if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$APP_VERSION" ]; then
          echo "Tag $GITHUB_REF_NAME does not match app/version.py (v$APP_VERSION)" >&2
          exit 1
        fi

    - name: Install system libraries
      run: |
        sudo apt-get update
        sudo apt-get install -y libportaudio2 libsndfile1 libgl1 libegl1 \
          libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
          libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libdbus-1-3

    - name: Install appimagetool
      run: |
        curl -fsSL -o appimagetool.AppImage \
          https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
        chmod +x appimagetool.AppImage
        # Runners have no FUSE; unpack it and put the real binary on PATH.
        ./appimagetool.AppImage --appimage-extract >/dev/null
        mkdir -p "$HOME/.local/bin"
        ln -sf "$PWD/squashfs-root/AppRun" "$HOME/.local/bin/appimagetool"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Create build environment
      run: |
        python -m venv .env
        .env/bin/python -m pip install --upgrade pip
        .env/bin/python -m pip install -r requirements.txt

    - name: Build AppImage
      env:
        ARCH: x86_64
      run: packaging/linux/appimage/build_appimage.sh

    - name: Bundle AppImage with install scripts
      run: |
        VERSION="$(.env/bin/python -c 'from app.version import __version__; print(__version__)')"
        cd dist
        zip "Valkyria-$VERSION-linux-x86_64.zip" \
          "Valkyria-$VERSION-x86_64.AppImage" install_appimage.sh uninstall_appimage.sh

    - uses: actions/upload-artifact@v7
      with:
        name: linux-appimage
        path: dist/Valkyria-*-linux-x86_64.zip
        if-no-files-found: error

  publish:
    if: github.ref_type == 'tag'
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v8
      with:
        path: release
        merge-multiple: true

    - name: Generate checksums
      working-directory: release
      run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create "$GITHUB_REF_NAME" release/* \
          --repo "$GITHUB_REPOSITORY" \
          --title "$GITHUB_REF_NAME" \
          --generate-notes
