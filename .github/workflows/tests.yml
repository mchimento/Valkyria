name: Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install system dependencies
      run: |
        if [[ "$RUNNER_OS" == "Linux" ]]; then
          sudo apt-get update
          sudo apt-get install -y vlc
        elif [[ "$RUNNER_OS" == "macOS" ]]; then
          brew install vlc
        fi
      shell: bash

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest  # optional, if using pytest

    - name: Run tests
      run: |
        python -m unittest discover tests

    - name: Check for syntax errors
      run: |
        python -m py_compile $(find . -name "*.py" -not -path "./build/*" -not -path "./dist/*")
      if: runner.os != 'Windows'

    - name: Check for syntax errors (Windows)
      run: |
        Get-ChildItem -Path . -Filter *.py -Recurse | Where-Object { $_.FullName -notmatch '\\build\\' -and $_.FullName -notmatch '\\dist\\' } | ForEach-Object { python -m py_compile $_.FullName }
      if: runner.os == 'Windows'
      shell: pwsh
