name: Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.12']

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libportaudio2 libsndfile1 libegl1 libgl1 libxkbcommon0
      if: runner.os == 'Linux'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Run tests
      run: |
        python -m unittest discover tests

    - name: Check for syntax errors
      run: |
        python -m py_compile $(find . -name "*.py" -not -path "./build/*" -not -path "./dist/*")
      if: runner.os != 'Windows'

    - name: Check for syntax errors (Windows)
      run: |
        Get-ChildItem -Path . -Filter *.py -Recurse | Where-Object { $_.FullName -notmatch '\\build\\' -and $_.FullName -notmatch '\\dist\\' } | ForEach-Object { python -m py_compile $_.FullName }
      if: runner.os == 'Windows'
      shell: pwsh
